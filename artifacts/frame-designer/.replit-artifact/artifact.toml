kind = "web"
previewPath = "/"
title = "HaiVuStudio Frame Designer"
version = "1.0.0"
id = "artifacts/frame-designer"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25187

[services.development]
run = "pnpm --filter @workspace/frame-designer run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/frame-designer", "run", "build" ]
serve = "static"
publicDir = "artifacts/frame-designer/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25187"
BASE_PATH = "/"
